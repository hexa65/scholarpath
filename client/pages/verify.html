<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — ScholarPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;
      min-height:100vh;background:var(--bg);padding:20px }
    .verify-card { background:#fff;border-radius:var(--radius);
      box-shadow:var(--card-shadow);padding:48px 40px;
      max-width:440px;width:100%;text-align:center }
    .verify-card .logo { font-family:'Syne',sans-serif;font-weight:800;
      font-size:1.5rem;color:var(--blue);margin-bottom:24px }
    .verify-card .logo span { color:var(--orange) }
    .icon { font-size:3.5rem;margin-bottom:16px }
    .verify-card h2 { font-size:1.4rem;font-weight:800;
      color:var(--blue);margin-bottom:10px }
    .verify-card p { color:var(--text-muted);font-size:.92rem;
      line-height:1.7;margin-bottom:20px }
    .btn-go { display:inline-block;background:var(--blue);color:#fff;
      padding:13px 32px;border-radius:25px;font-family:'Syne',sans-serif;
      font-weight:700;font-size:.95rem;text-decoration:none;
      transition:all .2s;margin-top:8px }
    .btn-go:hover { background:var(--blue-light) }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="verify-card" id="card">
  <div class="logo">Scholar<span>Path</span></div>
  <div class="icon" id="icon">⏳</div>
  <h2 id="title">Verifying your email...</h2>
  <p id="message">Please wait a moment.</p>
</div>

<script src="../js/app.js"></script>
<script>
  async function verify() {
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      document.getElementById('icon').textContent = '❌';
      document.getElementById('title').textContent = 'Invalid Link';
      document.getElementById('message').textContent =
        'This verification link is invalid. Please register again.';
      return;
    }
    try {
      await SP.apiFetch('/auth/verify/' + token);
      document.getElementById('icon').textContent = '✅';
      document.getElementById('title').textContent = 'Email Verified!';
      document.getElementById('message').textContent =
        'Your account is now active. You can log in to ScholarPath.';
      document.getElementById('card').insertAdjacentHTML('beforeend',
        '<a href="login.html" class="btn-go">Go to Login →</a>');
    } catch (e) {
      document.getElementById('icon').textContent = '❌';
      document.getElementById('title').textContent = 'Verification Failed';
      document.getElementById('message').textContent =
        e.message || 'This link may have expired. Please register again.';
    }
  }
  verify();
</script>
</body>
</html>
