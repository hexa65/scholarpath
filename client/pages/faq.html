<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ — ScholarPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .faq-hero{background:linear-gradient(135deg,#0a2a45,#123E63);padding:72px 0;text-align:center}
    .faq-hero h1{font-size:2.4rem;font-weight:800;color:#fff;margin:10px 0}
    .faq-hero p{color:rgba(255,255,255,.72);font-size:1rem;max-width:500px;margin:0 auto}
    .faq-search{max-width:560px;margin:24px auto 0;display:flex;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.2)}
    .faq-search input{flex:1;border:none;padding:14px 22px;font-family:inherit;font-size:.95rem;outline:none;color:var(--text)}
    .faq-search button{background:var(--orange);color:#fff;border:none;padding:13px 24px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;transition:background .2s}
    .faq-search button:hover{background:var(--orange-light)}
    .faq-layout{max-width:880px;margin:0 auto;padding:52px 24px}
    .faq-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
    .faq-tab{background:#fff;border:2px solid var(--border);border-radius:20px;padding:8px 20px;font-size:.88rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .2s}
    .faq-tab:hover,.faq-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .faq-group{margin-bottom:36px}
    .faq-group-title{font-size:1.1rem;font-weight:800;color:var(--blue);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .accordion-item{background:#fff;border-radius:var(--radius-sm);box-shadow:0 2px 10px rgba(18,62,99,.07);margin-bottom:8px;overflow:hidden;border:1.5px solid transparent;transition:border .2s}
    .accordion-item.open{border-color:var(--teal)}
    .accordion-btn{width:100%;background:none;border:none;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left;gap:12px;font-family:inherit}
    .accordion-btn span{font-size:.94rem;font-weight:600;color:var(--blue);line-height:1.4}
    .accordion-chevron{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;transition:all .25s;color:var(--text-muted)}
    .accordion-item.open .accordion-chevron{background:var(--teal);color:#fff;transform:rotate(180deg)}
    .accordion-body{max-height:0;overflow:hidden;transition:max-height .32s ease,padding .32s ease}
    .accordion-item.open .accordion-body{max-height:400px}
    .accordion-body p{padding:0 20px 18px;font-size:.9rem;color:var(--text-muted);line-height:1.8}
    .accordion-body a{color:var(--teal);font-weight:600}
    .still-help{background:linear-gradient(135deg,var(--blue),#1a5a8a);border-radius:var(--radius);padding:36px;text-align:center;margin-top:48px}
    .still-help h3{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:8px}
    .still-help p{color:rgba(255,255,255,.72);margin-bottom:20px;font-size:.92rem}
    .still-help-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="faq-hero">
  <div class="section-label" style="color:var(--yellow)">Help Centre</div>
  <h1>Frequently Asked Questions</h1>
  <p>Everything you need to know about ScholarPath — students, organisations, and platform features.</p>
  <div class="faq-search">
    <input type="text" id="faq-search-input" placeholder="Search questions…" oninput="filterFAQ(this.value)">
    <button>Search</button>
  </div>
</div>

<div class="faq-layout">
  <div class="faq-tabs">
    <button class="faq-tab active" onclick="filterTab(this,'all')">All Questions</button>
    <button class="faq-tab" onclick="filterTab(this,'general')">General</button>
    <button class="faq-tab" onclick="filterTab(this,'students')">For Students</button>
    <button class="faq-tab" onclick="filterTab(this,'orgs')">For Organisations</button>
    <button class="faq-tab" onclick="filterTab(this,'tech')">Technical</button>
  </div>

  <div id="faq-content"></div>

  <div class="still-help">
    <h3>Still need help?</h3>
    <p>Our support team typically responds within 24 hours on business days.</p>
    <div class="still-help-btns">
      <a href="contact.html" class="btn btn-outline-white">📧 Contact Support</a>
      <a href="community.html" class="btn" style="background:var(--orange);color:#fff">💬 Ask the Community</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast-container"></div>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script>
const FAQ_DATA = [
  {
    cat: 'general',
    title: '🌐 General Questions',
    items: [
      { q: 'What is ScholarPath?', a: 'ScholarPath is a free, AI-powered scholarship discovery and matching platform. We connect students with scholarship opportunities worldwide, using an intelligent algorithm to match each student to the scholarships they\'re most eligible for.' },
      { q: 'Is ScholarPath free to use?', a: 'Yes — ScholarPath is completely free for students. There are no subscription fees, no application charges, and no hidden costs. We are funded through partnerships with organisations who post scholarships on our platform.' },
      { q: 'How many scholarships are on ScholarPath?', a: 'We currently have 500+ active scholarships from 120+ partner organisations. New scholarships are added every week. You can browse all opportunities on our <a href="find.html">Find Scholarships</a> page.' },
      { q: 'Which countries and levels of study are covered?', a: 'We cover scholarships from over 78 countries and at all study levels — Undergraduate, Masters, PhD, and Postdoctoral. We specifically prioritise scholarships open to students from developing nations.' },
      { q: 'Are the scholarships on ScholarPath verified?', a: 'Yes. Every scholarship listed goes through a manual verification process by our team. We check eligibility criteria, organisation legitimacy, funding details, and deadline accuracy before publishing.' },
    ]
  },
  {
    cat: 'students',
    title: '🎓 For Students',
    items: [
      { q: 'How does the Eligibility Matcher work?', a: 'Our AI Eligibility Matcher asks you 7 questions about your profile (country, level, field, GPA, destination, funding preference, and skills). It then runs a weighted algorithm against all active scholarships and returns a ranked list with percentage match scores and confidence ratings.' },
      { q: 'What does a "92% Match" mean?', a: 'A match percentage tells you how well your profile aligns with a scholarship\'s eligibility criteria. 92% means you meet nearly all the requirements. It\'s calculated across level of study (30pts), field (25pts), destination (20pts), funding type (15pts), and GPA (10pts).' },
      { q: 'Can I apply to multiple scholarships at the same time?', a: 'Absolutely. You can apply to as many scholarships as you like on ScholarPath. We recommend applying to at least 5–10 matches to maximise your chances. Your dashboard tracks all your applications in one place.' },
      { q: 'How do I track my application status?', a: 'Your <a href="dashboard.html">Student Dashboard</a> shows the real-time status of every application: Pending, Under Review, Accepted, or Not Selected. You\'ll also receive email and in-app notifications when your status changes.' },
      { q: 'How do deadline reminders work?', a: 'Once you save a scholarship, our system automatically tracks its deadline and sends you email reminders at 30 days, 14 days, 7 days, and 3 days before the closing date. You can also see all upcoming deadlines in your dashboard.' },
      { q: 'Can I save a scholarship to apply later?', a: 'Yes. Click the "Save" button on any scholarship card or detail page. Saved scholarships appear in your dashboard under "Saved Scholarships" and you\'ll receive deadline reminders for them automatically.' },
      { q: 'What documents should I upload to my profile?', a: 'We recommend uploading: Academic Transcripts, CV/Résumé, Personal Statement, and Reference Letters. Having these ready speeds up applications significantly when deadlines are close. Supported formats: PDF, DOC, DOCX, JPG, PNG (max 10MB each).' },
      { q: 'Is my personal data secure?', a: 'Yes. All data is encrypted in transit (HTTPS/TLS) and at rest. We use JWT authentication, bcrypt password hashing, and follow GDPR-compliant data handling. We never sell your personal data. See our Privacy Policy for full details.' },
    ]
  },
  {
    cat: 'orgs',
    title: '🏛️ For Organisations',
    items: [
      { q: 'How do I post a scholarship on ScholarPath?', a: 'Register an Organisation account, complete the verification process (usually 2–3 business days), then use your Organisation Dashboard to create a scholarship listing. You\'ll fill in the title, description, eligibility criteria, benefits, required documents, deadline, and award amount.' },
      { q: 'Is there a cost to post scholarships?', a: 'Posting scholarships on ScholarPath is currently free for verified organisations as part of our launch programme. Contact us at partnerships@scholarpath.com to discuss enterprise plans for high-volume postings or premium placement.' },
      { q: 'How does organisation verification work?', a: 'After registering, submit your organisation\'s registration documents (charity number, company registration, or institutional letterhead). Our team reviews within 2–3 business days. Verified organisations receive a trust badge visible to students.' },
      { q: 'Can I manage applications through the platform?', a: 'Yes. Your Organisation Dashboard lets you view all applicants, filter by status, review profiles, and accept or reject applications with a single click. Students are automatically notified when their status changes.' },
      { q: 'What analytics do I get for my scholarships?', a: 'Your analytics dashboard shows: total views, total applications, application status breakdown, monthly trends, bookmarks/saves, and top-performing scholarships. Data is updated in real time.' },
    ]
  },
  {
    cat: 'tech',
    title: '⚙️ Technical Support',
    items: [
      { q: 'I didn\'t receive my verification email. What should I do?', a: 'Check your spam/junk folder first. If it\'s not there, wait 5 minutes and try again. You can also request a new verification email from the login page. If the problem persists, contact support at support@scholarpath.com.' },
      { q: 'How do I reset my password?', a: 'Click "Forgot password?" on the login page, enter your registered email, and we\'ll send you a secure reset link. The link is valid for 1 hour. If you don\'t receive it, check your spam folder or contact support.' },
      { q: 'Which browsers are supported?', a: 'ScholarPath works on all modern browsers: Chrome, Firefox, Safari, Edge (version 88+). We recommend Chrome or Firefox for the best experience. JavaScript must be enabled.' },
      { q: 'Is there a mobile app?', a: 'Not yet — but ScholarPath is fully responsive and works beautifully in mobile browsers. A native iOS and Android app is on our roadmap for Q3 2025. You can add ScholarPath to your home screen from your mobile browser for an app-like experience.' },
      { q: 'I found a bug or error. How do I report it?', a: 'We appreciate bug reports! Use the Contact form on our <a href="contact.html">Contact page</a> or email bugs@scholarpath.com with a description of the issue, your browser, and a screenshot if possible. We aim to respond within 24 hours.' },
    ]
  }
];

let activeTab = 'all';

function renderFAQ(filter = '') {
  const content = document.getElementById('faq-content');
  const groups = FAQ_DATA.filter(g => activeTab === 'all' || g.cat === activeTab);
  let html = '';
  groups.forEach(group => {
    const items = filter
      ? group.items.filter(i => i.q.toLowerCase().includes(filter.toLowerCase()) || i.a.toLowerCase().includes(filter.toLowerCase()))
      : group.items;
    if (!items.length) return;
    html += `<div class="faq-group" data-cat="${group.cat}">
      <div class="faq-group-title">${group.title}</div>
      ${items.map((item, idx) => `
      <div class="accordion-item" id="acc-${group.cat}-${idx}">
        <button class="accordion-btn" onclick="toggleAccordion('acc-${group.cat}-${idx}')">
          <span>${item.q}</span>
          <div class="accordion-chevron">▼</div>
        </button>
        <div class="accordion-body"><p>${item.a}</p></div>
      </div>`).join('')}
    </div>`;
  });
  content.innerHTML = html || '<p style="color:var(--text-muted);text-align:center;padding:40px">No questions match your search. Try different keywords.</p>';
}

function toggleAccordion(id) {
  const item = document.getElementById(id);
  const isOpen = item.classList.contains('open');
  // Close all
  document.querySelectorAll('.accordion-item.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) item.classList.add('open');
}

function filterTab(btn, cat) {
  document.querySelectorAll('.faq-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = cat;
  renderFAQ(document.getElementById('faq-search-input').value);
}

function filterFAQ(val) {
  renderFAQ(val);
}

renderFAQ();
</script>
</body>
</html>
