<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Detail — ScholarPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .detail-page{max-width:1100px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
    .detail-hero{background:linear-gradient(135deg,#0a2a45,#123E63,#1a5a8a);border-radius:var(--radius);padding:32px;margin-bottom:22px;position:relative;overflow:hidden}
    .detail-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(62,193,201,.15),transparent);border-radius:50%}
    .back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:none;color:#fff;padding:7px 15px;border-radius:20px;font-size:.82rem;font-weight:500;cursor:pointer;margin-bottom:20px;transition:all .18s}
    .back-btn:hover{background:rgba(255,255,255,.24)}
    .org-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .det-org-logo{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#fff;flex-shrink:0}
    .detail-hero h1{font-size:1.85rem;font-weight:800;color:#fff;margin-bottom:10px;line-height:1.2}
    .meta-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .meta-pill{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,.75);font-size:.83rem}
    .det-section{background:#fff;border-radius:var(--radius);padding:26px;margin-bottom:18px;box-shadow:var(--card-shadow)}
    .det-section h2{font-size:1.05rem;font-weight:700;color:var(--blue);margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--bg)}
    .check-list{list-style:none;padding:0}
    .check-list li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f4f7f9;font-size:.9rem;color:#3a4d5c;line-height:1.6}
    .check-list li:last-child{border-bottom:none}
    .check-icon{color:var(--teal);font-weight:700;flex-shrink:0;margin-top:1px}
    .doc-row{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:var(--radius-sm);padding:11px 16px;margin-bottom:8px}
    .doc-icon{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:700;flex-shrink:0}
    .sidebar-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--card-shadow);margin-bottom:18px}
    .countdown-box{text-align:center;background:var(--bg);border-radius:var(--radius-sm);padding:24px;margin-bottom:18px}
    .countdown-num{font-family:'Syne',sans-serif;font-size:3.8rem;font-weight:800;line-height:1}
    .countdown-lbl{font-size:.85rem;color:var(--text-muted);margin-top:4px}
    .apply-btn{display:block;width:100%;background:var(--orange);color:#fff;border:none;padding:16px;border-radius:25px;font-size:1rem;font-weight:700;font-family:'Syne',sans-serif;text-align:center;cursor:pointer;transition:all .25s;margin-bottom:10px}
    .apply-btn:hover{background:var(--orange-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,138,31,.35)}
    .save-sch-btn{display:block;width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);padding:13px;border-radius:25px;font-size:.9rem;font-weight:700;font-family:'Syne',sans-serif;text-align:center;cursor:pointer;transition:all .25s}
    .save-sch-btn:hover{background:var(--bg)}
    .summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f4f7f9;font-size:.88rem}
    .summary-row:last-child{border-bottom:none}
    .summary-label{color:var(--text-muted)}
    .summary-value{font-weight:700;color:var(--blue)}
    .similar-card{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .18s}
    .similar-card:last-child{border-bottom:none}
    .similar-card:hover h4{color:var(--teal)}
    .sim-logo{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0}
    @media(max-width:820px){.detail-page{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="detail-page" id="detail-page">
  <div style="grid-column:1/-1;text-align:center;padding:60px">
    <div class="spinner" style="margin:0 auto 16px"></div>
    <p style="color:var(--text-muted)">Loading scholarship details…</p>
  </div>
</div>
<div id="footer-placeholder"></div>
<div id="toast-container"></div>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const FALLBACK_DATA = {
  '1':{_id:'1',title:'Commonwealth Masters Scholarship',orgName:'Commonwealth Scholarship Commission',orgColor:'#123E63',country:'UK',level:'Masters',field:'Any',fundingType:'Fully Funded',amount:'£28,000/yr',deadline:new Date(Date.now()+45*86400000),match:94,description:'The Commonwealth Scholarship Commission offers full scholarships for postgraduate students from Commonwealth countries to study in the UK. These awards cover all study costs and provide a generous living stipend for the duration of your programme.',eligibility:['Must be a citizen of a Commonwealth country','Must hold a first degree at minimum upper second class (2:1)','Must be unable to afford this programme without this scholarship','Cannot have studied or worked in a developed country for more than 2 years'],benefits:['Full tuition fees paid in full','Monthly living allowance (£1,236 London / £1,040 elsewhere)','Return economy airfare to/from UK','Arrival allowance of £887','Warm clothing allowance'],requiredDocs:['Academic transcripts & degree certificate','Two academic/professional references','Personal statement (500 words max)','Research statement (if applicable)','Proof of English proficiency (IELTS/TOEFL)']},
  '2':{_id:'2',title:'Gates Cambridge Scholarship',orgName:'Gates Foundation',orgColor:'#1a5a8a',country:'UK',level:'PhD',field:'Any',fundingType:'Fully Funded',amount:'£50,000/yr',deadline:new Date(Date.now()+12*86400000),match:87,description:'Gates Cambridge Scholarships are prestigious full-cost awards for outstanding applicants from any country outside the UK to pursue a postgraduate degree at the University of Cambridge. Over 1,800 Gates Cambridge Scholars from 100+ countries have been awarded since 2001.',eligibility:['Must be a citizen of any country outside the UK','Applying for full-time postgraduate degree at Cambridge','Demonstrate outstanding academic achievement','Show leadership potential and commitment to improving lives'],benefits:['Full tuition fees for the duration of your course','Maintenance allowance (£18,744 p.a.)','Flights to and from UK','Family allowance (if applicable)','Discretionary funding for academic development'],requiredDocs:['Cambridge graduate application form','Academic CV','Research proposal or statement of purpose','Three academic references','English language certificate if applicable']},
  '3':{_id:'3',title:'Chevening Scholarship',orgName:'UK Foreign Office',orgColor:'#c0392b',country:'UK',level:'Masters',field:'Any',fundingType:'Fully Funded',amount:'£25,000/yr',deadline:new Date(Date.now()+28*86400000),match:91,description:'Chevening is the UK government\'s international awards programme, funded by the Foreign, Commonwealth & Development Office. Scholarships are awarded to individuals who demonstrate the attributes required to become future leaders and decision makers.',eligibility:['Citizen of a Chevening-eligible country','Minimum 2 years work experience','Hold an undergraduate degree equivalent to a UK upper second class (2:1)','Apply to three different UK universities','Meet the Chevening English language requirement'],benefits:['Tuition fees paid in full','Monthly stipend to cover living costs','Economy return flights','Arrival and departure allowances','Chevening network events and experiences'],requiredDocs:['University acceptance letters (3)','Reference letters (2)','Work experience evidence','Degree transcript','IELTS/TOEFL certificate']},
};

async function loadDetail(){
  let s = null;
  if(id){
    try{ s = await SP.apiFetch('/scholarships/'+id); }catch{}
  }
  if(!s){ s = FALLBACK_DATA[id] || FALLBACK_DATA['1']; }
  renderDetail(s);
}

function renderDetail(s){
  const days = SP.daysUntil(s.deadline);
  const dCls = SP.deadlineClass(days);
  const cdColor = dCls==='deadline-red'?'var(--orange)':dCls==='deadline-yellow'?'#c89600':'#1a7a4a';
  const isSaved = (SP.Auth.getUser()?.bookmarks||[]).includes(s._id);
  document.title = s.title+' — ScholarPath';

  const SIMILAR = [
    {title:'Chevening Scholarship',org:'UK Foreign Office',c:'#c0392b',amt:'£25,000/yr',lvl:'Masters'},
    {title:'Gates Cambridge',org:'Gates Foundation',c:'#1a5a8a',amt:'£50,000/yr',lvl:'PhD'},
    {title:'DAAD Scholarship',org:'DAAD Germany',c:'#3EC1C9',amt:'€1,000/mo',lvl:'Masters'},
  ].filter(x=>x.title!==s.title);

  document.getElementById('detail-page').innerHTML = `
  <div>
    <div class="detail-hero">
      <button class="back-btn" onclick="history.back()">← Back to Results</button>
      <div class="org-row">
        <div class="det-org-logo" style="background:${s.orgColor||'#123E63'}">${(s.orgName||'ORG').substring(0,2).toUpperCase()}</div>
        <div>
          <div style="font-size:.95rem;font-weight:700;color:#fff">${s.orgName||'Organisation'}</div>
          <div style="font-size:.8rem;color:rgba(255,255,255,.6)">Verified Partner ✓</div>
        </div>
      </div>
      <h1>${s.title}</h1>
      <div class="meta-pills">
        <span class="meta-pill">🌍 ${s.country}</span>
        <span class="meta-pill">🎓 ${s.level}</span>
        <span class="meta-pill">📚 ${s.field}</span>
        <span class="meta-pill">💰 ${s.fundingType}</span>
        ${s.match?`<span style="background:rgba(62,193,201,.2);border:1px solid rgba(62,193,201,.4);color:#3EC1C9;border-radius:10px;padding:3px 10px;font-size:.78rem;font-weight:700">⚡ ${s.match}% Match</span>`:''}
      </div>
    </div>

    <div class="det-section">
      <h2>About This Scholarship</h2>
      <p style="font-size:.92rem;line-height:1.85;color:#3a4d5c">${s.description||'No description provided.'}</p>
    </div>

    ${s.eligibility?.length?`<div class="det-section"><h2>Eligibility Criteria</h2><ul class="check-list">${s.eligibility.map(e=>`<li><span class="check-icon">✓</span>${e}</li>`).join('')}</ul></div>`:''}
    ${s.benefits?.length?`<div class="det-section"><h2>Benefits &amp; Coverage</h2><ul class="check-list">${s.benefits.map(b=>`<li><span class="check-icon">⭐</span>${b}</li>`).join('')}</ul></div>`:''}
    ${s.requiredDocs?.length?`<div class="det-section"><h2>Required Documents</h2>${s.requiredDocs.map(d=>`<div class="doc-row"><div class="doc-icon">📄</div><span style="font-size:.9rem;font-weight:500;color:var(--blue)">${d}</span></div>`).join('')}</div>`:''}

    <div class="det-section" style="background:linear-gradient(135deg,var(--bg),#ddf0f7);border:none;text-align:center">
      <h2 style="border:none;padding:0;margin-bottom:8px">Ready to Apply?</h2>
      <p style="font-size:.9rem;color:var(--text-muted);margin-bottom:20px">Deadline in <strong style="color:${cdColor}">${Math.max(0,days)} days</strong>. Don't miss this opportunity.</p>
      <button class="apply-btn" style="max-width:300px;margin:0 auto" onclick="applyNow('${s._id}')">Apply Now →</button>
    </div>
  </div>

  <div style="position:sticky;top:80px">
    <div class="sidebar-card">
      <div class="countdown-box">
        <div class="countdown-num" style="color:${cdColor}">${Math.max(0,days)}</div>
        <div class="countdown-lbl">days remaining</div>
        <div class="deadline-badge ${dCls}" style="display:inline-block;margin-top:10px">${SP.deadlineLabel(days)}</div>
      </div>
      <button class="apply-btn" onclick="applyNow('${s._id}')">Apply Now</button>
      <button class="save-sch-btn" id="save-btn" onclick="handleSave('${s._id}')">
        ${isSaved?'✓ Saved to Dashboard':'🔖 Save Scholarship'}
      </button>
    </div>

    <div class="sidebar-card">
      <h3 style="font-size:1rem;font-weight:700;color:var(--blue);margin-bottom:18px">Quick Summary</h3>
      <div class="summary-row"><span class="summary-label">Award Value</span><span class="summary-value">${s.amount||'—'}</span></div>
      <div class="summary-row"><span class="summary-label">Study Level</span><span class="summary-value">${s.level}</span></div>
      <div class="summary-row"><span class="summary-label">Country</span><span class="summary-value">${s.country}</span></div>
      <div class="summary-row"><span class="summary-label">Field</span><span class="summary-value">${s.field}</span></div>
      <div class="summary-row"><span class="summary-label">Funding</span><span class="summary-value">${s.fundingType}</span></div>
      ${s.match?`<div class="summary-row"><span class="summary-label">Your Match</span><span class="summary-value" style="color:var(--teal)">${s.match}%</span></div>`:''}
    </div>

    <div class="sidebar-card">
      <h3 style="font-size:1rem;font-weight:700;color:var(--blue);margin-bottom:16px">Similar Scholarships</h3>
      ${SIMILAR.map(sim=>`
      <div class="similar-card" onclick="window.location='find.html'">
        <div class="sim-logo" style="background:${sim.c}">${sim.org.substring(0,2).toUpperCase()}</div>
        <div><h4 style="font-size:.87rem;font-weight:600;color:var(--blue)">${sim.title}</h4>
        <p style="font-size:.76rem;color:var(--text-muted);margin-top:2px">${sim.org} · ${sim.lvl} · ${sim.amt}</p></div>
      </div>`).join('')}
    </div>
  </div>`;
}

async function applyNow(schId){
  if(!SP.Auth.isLoggedIn()){SP.Toast.warn('Please log in to apply');setTimeout(()=>window.location='login.html',1000);return;}
  if(SP.Auth.role()==='organization'){SP.Toast.warn('Organisations cannot apply for scholarships');return;}
  try{
    await SP.apiFetch('/applications/'+schId+'/apply',{method:'POST',body:JSON.stringify({statement:''})});
    SP.Toast.success('🎓 Application submitted! Check your dashboard.');
  }catch(e){
    if(e.message?.includes('Already applied'))SP.Toast.warn('You have already applied for this scholarship');
    else SP.Toast.error(e.message||'Failed to submit. Please try again.');
  }
}

async function handleSave(schId){
  if(!SP.Auth.isLoggedIn()){SP.Toast.warn('Please log in to save scholarships');return;}
  try{
    const data=await SP.apiFetch('/scholarships/'+schId+'/bookmark',{method:'POST'});
    const saved=data.bookmarks?.includes(schId);
    document.getElementById('save-btn').textContent=saved?'✓ Saved to Dashboard':'🔖 Save Scholarship';
    SP.Toast.success(saved?'Saved to your dashboard!':'Removed from saved');
  }catch{SP.Toast.error('Could not save. Please try again.');}
}

loadDetail();
</script>
</body>
</html>
