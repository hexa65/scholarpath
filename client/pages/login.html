<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — ScholarPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body{display:flex;align-items:stretch;min-height:100vh}
    .auth-left{flex:1;background:linear-gradient(145deg,#0a2a45,#123E63,#1a5a8a);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;position:relative;overflow:hidden}
    .auth-left::before{content:'';position:absolute;top:-80px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(62,193,201,.15),transparent 65%)}
    .auth-left::after{content:'';position:absolute;bottom:-60px;left:-40px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,138,31,.12),transparent 65%)}
    .auth-left-content{position:relative;z-index:1;text-align:center;max-width:360px}
    .auth-brand{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:#fff;margin-bottom:32px}
    .auth-brand span{color:#FF8A1F}
    .auth-left h2{font-size:2rem;font-weight:800;color:#fff;line-height:1.2;margin-bottom:14px}
    .auth-left p{color:rgba(255,255,255,.72);font-size:.95rem;line-height:1.7}
    .auth-stat{display:flex;justify-content:center;gap:32px;margin-top:36px;padding-top:28px;border-top:1px solid rgba(255,255,255,.12)}
    .auth-stat-item .n{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:#F9C74F}
    .auth-stat-item .l{font-size:.75rem;color:rgba(255,255,255,.55);margin-top:3px}
    .auth-right{width:480px;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:40px}
    .auth-box{width:100%}
    .auth-box h2{font-size:1.7rem;font-weight:800;color:var(--blue);margin-bottom:6px}
    .auth-box p{color:var(--text-muted);font-size:.9rem;margin-bottom:28px}
    .auth-box a{color:var(--teal);font-weight:600}
    .input-icon-wrap{position:relative}
    .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--text-muted);pointer-events:none}
    .input-icon-wrap .form-control{padding-left:40px}
    .btn-auth{width:100%;background:var(--blue);color:#fff;border:none;padding:14px;border-radius:30px;font-size:1rem;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;transition:all .25s;margin-top:8px}
    .btn-auth:hover{background:var(--blue-light);transform:translateY(-2px)}
    .divider{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:.82rem;margin:20px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .social-auth{display:flex;gap:10px}
    .social-auth-btn{flex:1;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:11px;font-size:.88rem;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .social-auth-btn:hover{border-color:var(--teal);color:var(--teal)}
    .form-error-msg{background:#feecec;color:#c0392b;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:16px;display:none}
    @media(max-width:768px){body{flex-direction:column}.auth-left{min-height:220px;padding:32px 24px}.auth-right{width:100%;padding:28px 20px}}
  </style>
</head>
<body>
<div class="auth-left">
  <div class="auth-left-content">
    <div class="auth-brand">Scholar<span>Path</span> 🎓</div>
    <h2>Welcome Back, Scholar</h2>
    <p>Log in to access your saved scholarships, track applications, and discover new opportunities matched to your profile.</p>
    <div class="auth-stat">
      <div class="auth-stat-item"><div class="n">500+</div><div class="l">Active Scholarships</div></div>
      <div class="auth-stat-item"><div class="n">12K+</div><div class="l">Students Matched</div></div>
      <div class="auth-stat-item"><div class="n">$48M</div><div class="l">Awards Given</div></div>
    </div>
  </div>
</div>

<div class="auth-right">
  <div class="auth-box">
    <h2>Log In</h2>
    <p>Don't have an account? <a href="register.html">Sign up free</a></p>

    <div class="form-error-msg" id="err-msg"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="input-icon-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between">
          Password <a href="forgot-password.html" style="font-weight:500;font-size:.82rem">Forgot password?</a>
        </label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn-auth" id="submit-btn">Log In</button>
    </form>

    <div class="divider">or continue with</div>
    <div class="social-auth">
      <button class="social-auth-btn" onclick="SP.Toast.warn('OAuth coming soon!')">🔵 Google</button>
      <button class="social-auth-btn" onclick="SP.Toast.warn('OAuth coming soon!')">🔷 LinkedIn</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/app.js"></script>
<script>
  if (SP.Auth.isLoggedIn()) {
    const r = SP.Auth.role();
    window.location = r === 'organization' ? 'org-dashboard.html' : r === 'admin' ? 'admin.html' : 'dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('err-msg');
    btn.textContent = 'Logging in…'; btn.disabled = true;
    err.style.display = 'none';
    try {
      const data = await SP.apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
      });
      SP.Auth.setSession(data.token, data.user);
      SP.Toast.success('Welcome back! Redirecting…');
      setTimeout(() => {
        const r = data.user.role;
        window.location = r === 'organization' ? 'org-dashboard.html' : r === 'admin' ? 'admin.html' : 'dashboard.html';
      }, 800);
    } catch (error) {
      err.textContent = error.message; err.style.display = 'block';
      btn.textContent = 'Log In'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
